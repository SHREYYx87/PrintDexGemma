      (function() {
        if (typeof window !== 'undefined' && window.location && (window.location.hostname.endsWith('github.io') || window.location.hostname.includes('github.io'))) {
          var path = window.location.pathname;
          if (!path.includes('/docs') && !path.includes('/dist')) {
            var target = path.endsWith('/') ? path + 'docs/' : path + '/docs/';
            window.location.replace(target + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
